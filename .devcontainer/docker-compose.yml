services:
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    volumes: [ "..:/workspace:cached" ]
    command: sleep infinity
    ports: [ "4321:4321" ]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    volumes: [ "..:/workspace:cached" ]
    command: sleep infinity
    ports: [ "8000:8000" ]
    environment:
      - PYTHONUNBUFFERED=1
