---
- name: Install LVM and iSCSI tools (iSCSI required by Longhorn)
  ansible.builtin.apt:
    name:
      - lvm2
      - open-iscsi
      - nfs-common   # Longhorn le recommande pour les volumes RWX (accès multi-pods)
    state: present
    update_cache: true

- name: Ensure iscsid is enabled and running (Longhorn hard requirement)
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Check for the expected OCI block device symlink
  ansible.builtin.stat:
    path: "{{ storage_device_path }}"
  register: oracle_data_device

- name: Safety check — confirm the expected device exists and isn't root
  ansible.builtin.assert:
    that:
      - oracle_data_device.stat.exists
      - oracle_data_device.stat.islnk
    fail_msg: >
      The device {{ storage_device_path }} is not found — please verify
      that the Terraform volume is properly attached before rerunning.

- name: Create LVM physical volume (no-op if already done)
  community.general.lvg:
    vg: data_vg
    pvs: "{{ storage_device_path }}"
    state: present

- name: Create logical volume using 100% of the volume group
  community.general.lvol:
    vg: data_vg
    lv: data_lv
    size: 100%VG
    state: present
    shrink: false   # garde-fou : n'accepte jamais de RÉDUIRE le volume

- name: Format the logical volume as ext4 (no-op if already formatted)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/data_vg/data_lv

- name: Mount the logical volume persistently
  ansible.posix.mount:
    path: "{{ storage_mount_path }}"
    src: /dev/data_vg/data_lv
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Ensure correct ownership
  ansible.builtin.file:
    path: "{{ storage_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
