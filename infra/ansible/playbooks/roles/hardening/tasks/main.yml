---
# --- Neutraliser le pare-feu restrictif par défaut d'Oracle, EN PREMIER ---
# Les images marketplace Oracle embarquent netfilter-persistent avec une
# liste blanche stricte (SSH uniquement) — à désactiver avant toute autre
# tâche, puisque k3s a besoin du reste des ports ouverts pour fonctionner.
- name: Check for Oracle's default iptables-persistent service
  ansible.builtin.systemd:
    name: netfilter-persistent
  register: netfilter_persistent_status
  failed_when: false

- name: Disable Oracle's default restrictive iptables ruleset
  when: netfilter_persistent_status.status is defined
  block:
    - name: Stop and disable netfilter-persistent
      ansible.builtin.systemd:
        name: netfilter-persistent
        state: stopped
        enabled: false
      notify: Reboot node

    - name: Mask the service to prevent re-activation
      ansible.builtin.systemd:
        name: netfilter-persistent
        masked: true

    - name: Remove the persisted restrictive rules file
      ansible.builtin.file:
        path: /etc/iptables/rules.v4
        state: absent

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest security patches
  ansible.builtin.apt:
    upgrade: safe

- name: Check whether a reboot is required by package upgrades
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Trigger reboot if upgrades require it
  ansible.builtin.command: /bin/true
  changed_when: true
  when: reboot_required_file.stat.exists
  notify: Reboot node 

- name: Set timezone
  community.general.timezone:
    name: "{{ hardening_timezone }}"

- name: Ensure chrony is installed for accurate time sync
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# chrony et systemd-timesyncd se disputeraient la même horloge si les deux
# restaient actifs — chrony est le plus précis des deux, on retire l'autre
- name: Remove systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent

- name: Configure automatic security updates
  ansible.builtin.import_tasks: updates.yml

- name: Harden the system SSH daemon (defense in depth)
  ansible.builtin.import_tasks: ssh.yml

- name: Apply kernel network hardening
  ansible.builtin.import_tasks: sysctl.yml

- name: Enable audit logging
  ansible.builtin.import_tasks: audit.yml

# Prérequis strict de Kubernetes/k3s : kubelet refuse de démarrer si du
# swap est actif
- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: ansible_swaptotal_mb > 0

- name: Remove any swap entry from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+\S+\s+swap\s+'
    state: absent
