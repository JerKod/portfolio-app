---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable the periodic update timers
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# Un redémarrage automatique en pleine nuit sur un nœud k3s pourrait
# provoquer une coupure non planifiée — on le laisse désactivé et on
# gère les redémarrages volontairement (cf. GameDays de la doc)
- name: Configure automatic reboot policy
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^(//\s*)?Unattended-Upgrade::Automatic-Reboot\s'
    line: 'Unattended-Upgrade::Automatic-Reboot "{{ hardening_unattended_upgrades_auto_reboot | lower }}";'
    create: true
    mode: "0644"
