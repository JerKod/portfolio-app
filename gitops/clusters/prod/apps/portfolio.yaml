apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JerKod/portfolio-app.git
    targetRevision: main
    path: gitops/charts/portfolio
    helm:
      parameters:
        - name: web.image.tag
          value: "sha-c1358a0"
        - name: api.image.tag
          value: "sha-8faadbd"
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
