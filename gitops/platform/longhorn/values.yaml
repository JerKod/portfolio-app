preUpgradeChecker:
  jobEnabled: false

defaultSettings:
  defaultDataPath: /mnt/longhorn
  defaultReplicaCount: 2
  createDefaultDiskLabeledNodes: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain   # une suppression de PVC ne détruit jamais les données par erreur

# Jamais exposé publiquement — même principe que pour Argo CD
ingress:
  enabled: false

longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 1Gi
