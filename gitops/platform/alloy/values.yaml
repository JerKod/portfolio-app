global:
  podSecurityContext:
    # 999 est le GID standard de 'systemd-journal' sur Ubuntu d'OCI.
    supplementalGroups: [ 999 ]

alloy:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 256Mi }

  extraEnv:
    - name: GRAFANA_CLOUD_API_TOKEN
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: api-token } }
    - name: GRAFANA_CLOUD_PROM_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: prom-instance-id } }
    - name: GRAFANA_CLOUD_LOKI_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: loki-instance-id } }
    - name: GRAFANA_CLOUD_TEMPO_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: tempo-instance-id } }
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  configMap:
    content: |
      // ========== MÉTRIQUES ==========

      // --- node-exporter ---
      discovery.kubernetes "pods" { role = "pod" }

      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "prometheus-node-exporter"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "instance"
        }
      }

      prometheus.scrape "node_exporter" {
        targets         = discovery.relabel.node_exporter.output
        job_name        = "node-exporter"
        scrape_interval = "90s"
        forward_to      = [prometheus.relabel.drop_noise.receiver]
      }

      // --- kube-state-metrics ---
      discovery.relabel "ksm" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "kube-state-metrics"
          action        = "keep"
        }
      }

      prometheus.scrape "ksm" {
        targets         = discovery.relabel.ksm.output
        job_name        = "kube-state-metrics"
        scrape_interval = "90s"
        forward_to      = [prometheus.relabel.drop_noise.receiver]
      }

      // --- cAdvisor (via le proxy de l'API server) ---
      discovery.kubernetes "nodes" { role = "node" }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        // Toutes les requêtes passent par le proxy de l'API server,
        // jamais directement vers l'IP du kubelet
        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc:443"
        }

        // __metrics_path__ : UNIQUEMENT le chemin relatif
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "instance"
        }
      }

      prometheus.scrape "cadvisor" {
        targets           = discovery.relabel.cadvisor.output
        job_name          = "cadvisor"
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        scrape_interval   = "90s"

        tls_config {
          ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          server_name = "kubernetes"
        }

        forward_to = [prometheus.relabel.drop_noise.receiver]
      }

      // --- Filtre commun : liste blanche + nettoyage de cardinalité ---
      prometheus.relabel "drop_noise" {
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]

        rule {
          source_labels = ["__name__"]
          regex         = "up|node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_load1|node_load5|node_load15|node_disk_read_bytes_total|node_disk_written_bytes_total|kube_pod_status_phase|kube_pod_info|kube_pod_container_status_restarts_total|kube_pod_container_status_running|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_node_status_condition|kube_namespace_created|container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_fs_writes_total|machine_cpu_cores|machine_memory_bytes"
          action        = "keep"
        }

        // Filtrage des points de montage inutiles
        rule {
          source_labels = ["mountpoint"]
          regex         = "/|/mnt/longhorn|/boot"
          action        = "keep"
        }

        // --- Filtrage des interfaces réseau ---
        rule {
          source_labels = ["__name__", "device"]
          regex         = "node_network_.*;(veth.*|cali.*|cni.*|flannel.*|lxc.*|docker.*|br-.*)"
          action        = "drop"
        }

        // Filtrage des disques virtuels
        rule {
          source_labels = ["__name__", "device"]
          regex         = "node_disk_.*;(loop.*|ram.*)"
          action        = "drop"
        }

        // Filtrage des doublons de métriques container_* (déjà présentes dans kube-state-metrics)
        rule {
          source_labels = ["__name__", "namespace"]
          regex         = "container_.*;"
          action        = "drop"
        }

        // Nettoyage global des labels techniques inutiles
        rule {
          action = "labeldrop"
          regex  = "uid|pod_uid|container_id|pod_ip|host_ip|id"
        }
      }

      prometheus.remote_write "grafana_cloud" {
        endpoint {
          url = "https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push"
          basic_auth {
            username = env("GRAFANA_CLOUD_PROM_ID")
            password = env("GRAFANA_CLOUD_API_TOKEN")
          }
        }
      }

      // ========== LOGS ==========

      loki.source.journal "host" {
        path       = "/var/log/journal"
        forward_to = [loki.relabel.system_logs.receiver]
      }

      loki.relabel "system_logs" {
        forward_to = [loki.write.grafana_cloud.receiver]
        rule {
          target_label = "job"
          replacement  = "host-journal"
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Extraire le namespace
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // Extraire le nom du pod
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // Extraire le nom du conteneur
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.grafana_cloud.receiver]
      }

      loki.write "grafana_cloud" {
        endpoint {
          url = "https://logs-prod-012.grafana.net/loki/api/v1/push"
          basic_auth {
            username = env("GRAFANA_CLOUD_LOKI_ID")
            password = env("GRAFANA_CLOUD_API_TOKEN")
          }
        }
      }

      // ========== TRACES (pipeline prêt, aucune donnée tant que
      // portfolio-api n'est pas instrumenté — itération suivante) ==========

      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        output { traces = [otelcol.exporter.otlp.grafana_cloud.input] }
      }

      otelcol.exporter.otlp "grafana_cloud" {
        client {
          endpoint = "tempo-prod-10-prod-eu-west-2.grafana.net:443"
          auth     = otelcol.auth.basic.grafana_cloud.handler
        }
      }

      otelcol.auth.basic "grafana_cloud" {
        username = env("GRAFANA_CLOUD_TEMPO_ID")
        password = env("GRAFANA_CLOUD_API_TOKEN")
      }

  mounts:
    varlog: true

rbac:
  create: true
  clusterRules:
    # -- Rules required for the Nodes role in the `discovery.kubernetes` component.
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    # -- Rules required for the `discovery.kubelet` component.
    - apiGroups: [""]
      resources: ["nodes/pods"]
      verbs: ["get", "list", "watch"]
    # -- Rules required accessing metric endpoints on the Node (e.g. Kubelet, cAdvisor, etc...).
    - apiGroups: [""]
      resources: ["nodes/metrics","nodes/proxy"]
      verbs: ["get", "list", "watch"]
    # -- Rules required for accessing metrics endpoint.
    - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
      verbs: ["get"]

controller:
  type: daemonset
