alloy:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 160Mi }

  extraEnv:
    - name: GRAFANA_CLOUD_API_TOKEN
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: api-token } }
    - name: GRAFANA_CLOUD_PROM_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: prom-instance-id } }
    - name: GRAFANA_CLOUD_LOKI_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: loki-instance-id } }
    - name: GRAFANA_CLOUD_TEMPO_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: tempo-instance-id } }

  configMap:
    content: |
      // ========== MÉTRIQUES ==========

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "exporters_only" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(prometheus-node-exporter|kube-state-metrics)"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "instance"
        }
      }

      prometheus.scrape "kubernetes" {
        targets         = discovery.relabel.exporters_only.output
        scrape_interval = "60s"
        forward_to      = [prometheus.relabel.drop_noise.receiver]
      }

      prometheus.relabel "drop_noise" {
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]

        // Liste blanche unique : seules ces métriques survivent
        rule {
          source_labels = ["__name__"]
          regex         = "node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_load1|node_load5|node_load15|node_disk_read_bytes_total|node_disk_written_bytes_total|kube_pod_status_phase|kube_pod_info|kube_pod_container_status_restarts_total|kube_deployment_status_replicas_available|kube_node_status_condition"
          action        = "keep"
        }

        // uid : identifiant interne k8s, jamais utilisé pour filtrer/grouper.
        // pod_ip : change à chaque redémarrage/reschedule
        rule {
          action = "labeldrop"
          regex  = "uid|pod_ip"
        }
      }

      prometheus.remote_write "grafana_cloud" {
        endpoint {
          url = "https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push"
          basic_auth {
            username = env("GRAFANA_CLOUD_PROM_ID")
            password = env("GRAFANA_CLOUD_API_TOKEN")
          }
        }
      }

      // ========== LOGS ==========

      loki.source.journal "host" {
        forward_to = [loki.write.grafana_cloud.receiver]
      }

      discovery.kubernetes "pod_logs" { role = "pod" }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pod_logs.targets
        forward_to = [loki.write.grafana_cloud.receiver]
      }

      loki.write "grafana_cloud" {
        endpoint {
          url = "https://logs-prod-012.grafana.net/loki/api/v1/push"
          basic_auth {
            username = env("GRAFANA_CLOUD_LOKI_ID")
            password = env("GRAFANA_CLOUD_API_TOKEN")
          }
        }
      }

      // ========== TRACES (pipeline prêt, aucune donnée tant que
      // portfolio-api n'est pas instrumenté — itération suivante) ==========

      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        output { traces = [otelcol.exporter.otlp.grafana_cloud.input] }
      }

      otelcol.exporter.otlp "grafana_cloud" {
        client {
          endpoint = "tempo-prod-10-prod-eu-west-2.grafana.net:443"
          auth     = otelcol.auth.basic.grafana_cloud.handler
        }
      }

      otelcol.auth.basic "grafana_cloud" {
        username = env("GRAFANA_CLOUD_TEMPO_ID")
        password = env("GRAFANA_CLOUD_API_TOKEN")
      }

  mounts:
    extra:
      - name: host-journal
        mountPath: /var/log/journal
        readOnly: true
  extraVolumes:
    - name: host-journal
      hostPath: { path: /var/log/journal }

controller:
  type: daemonset
  volumes:
    extra:
      - name: host-journal
        hostPath:
          path: /var/log/journal
