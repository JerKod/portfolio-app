alloy:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 160Mi }

  extraEnv:
    - name: GRAFANA_CLOUD_API_TOKEN
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: api-token } }
    - name: GRAFANA_CLOUD_PROM_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: prom-instance-id } }
    - name: GRAFANA_CLOUD_LOKI_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: loki-instance-id } }
    - name: GRAFANA_CLOUD_TEMPO_ID
      valueFrom: { secretKeyRef: { name: grafana-cloud-credentials, key: tempo-instance-id } }

  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "exporters_only" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(prometheus-node-exporter|kube-state-metrics)"
          action        = "keep"
        }

        // Remplace l'IP:port par défaut par le vrai nom du nœud
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "instance"
        }
      }

      prometheus.scrape "kubernetes" {
        targets         = discovery.relabel.exporters_only.output
        scrape_interval = "60s"
        forward_to      = [prometheus.relabel.drop_noise.receiver]
      }

      // Filtre fin : métriques kube-state-metrics peu utiles
      prometheus.relabel "drop_noise" {
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]

        rule {
          source_labels = ["__name__"]
          regex         = "kube_pod_tolerations|kube_pod_status_qos_class|kube_pod_status_ready|kube_pod_status_scheduled"
          action        = "drop"
        }
      }

      prometheus.remote_write "grafana_cloud" {
        endpoint {
          url = "https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push"
          basic_auth {
            username = env("GRAFANA_CLOUD_PROM_ID")
            password = env("GRAFANA_CLOUD_API_TOKEN")
          }
        }
      }

      // --- Logs : journal système des 2 VM + logs des pods ---
      loki.source.journal "host" {
        forward_to = [loki.write.grafana_cloud.receiver]
      }

      discovery.kubernetes "pod_logs" { role = "pod" }
      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pod_logs.targets
        forward_to = [loki.write.grafana_cloud.receiver]
      }

      loki.write "grafana_cloud" {
        endpoint {
          url = "https://logs-prod-012.grafana.net/loki/api/v1/push"
          basic_auth {
            username = env("GRAFANA_CLOUD_LOKI_ID")
            password = env("GRAFANA_CLOUD_API_TOKEN")
          }
        }
      }

  mounts:
    extra:
      - name: host-journal
        mountPath: /var/log/journal
        readOnly: true
  extraVolumes:
    - name: host-journal
      hostPath: { path: /var/log/journal }

controller:
  type: daemonset
  volumes:
    extra:
      - name: host-journal
        hostPath:
          path: /var/log/journal
