apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  replicas: 1   # provisoire — passera à 2 + anti-affinité
  selector:
    matchLabels: { app: placeholder }
  template:
    metadata:
      labels: { app: placeholder }
    spec:
      containers:
        - name: web
          image: ghcr.io/jerkod/portfolio-web:edge
          ports: [{ containerPort: 8080 }]   # port exposé par nginx-unprivileged dans web/Dockerfile
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: placeholder
spec:
  selector: { app: placeholder }
  ports: [{ port: 80, targetPort: 8080 }]   # targetPort passe de 80 (nginx générique) à 8080 (image nginx-unprivileged)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: placeholder
spec:
  parentRefs:
    - name: public
      namespace: default
  rules:
    - backendRefs:
        - name: placeholder
          port: 80
