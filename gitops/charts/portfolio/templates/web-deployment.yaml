apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-web
  labels: {{ include "portfolio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: portfolio-web }
  template:
    metadata:
      labels: { app: portfolio-web }
    spec:
      # Force la répartition sur des nœuds différents — aucun intérêt
      # à avoir 2 réplicas si les deux peuvent finir sur le même nœud
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: portfolio-web }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          ports: [{ containerPort: 8080 }]
          resources: {{ .Values.web.resources | toYaml | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
