apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
spec:
  parentRefs:
    - name: public
      namespace: default
      sectionName: https   # le trafic réel ne sert QUE du HTTPS, jamais du HTTP en clair
  hostnames:
    - "{{ .Values.hostname }}"
  rules:
    # Règle la plus spécifique en premier, par lisibilité — Gateway API
    # départage de toute façon automatiquement par longueur de préfixe,
    # peu importe l'ordre d'écriture ici
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: portfolio-api
          port: 8000
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: portfolio-web
          port: 80
