apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
  labels: {{ include "portfolio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: portfolio-api }
  template:
    metadata:
      labels: { app: portfolio-api }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: portfolio-api }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports: [{ containerPort: 8000 }]
          resources: {{ .Values.api.resources | toYaml | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
